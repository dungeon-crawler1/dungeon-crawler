# Servidor Nginx para los frontends (React y Vue).
# Sirve el build estático con fallback de SPA y proxea /api al backend Express.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # La API vive en el mismo origen que la página: no hace falta configurar
    # VITE_API_URL ni abrir el puerto del backend a la LAN.
    location /api/ {
        proxy_pass http://backend-express:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Assets con hash de Vite: cacheables por un año.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback para las rutas del router (React Router / Vue Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
