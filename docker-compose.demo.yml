# Demo completa con un solo comando:
#   docker compose -f docker-compose.demo.yml up -d --build
#
# Levanta PostgreSQL, los dos backends y los dos frontends compilados y
# servidos por Nginx. Sólo se publican los puertos de los frontends:
#   React  -> http://<IP-DEL-HOST>:8080
#   Vue    -> http://<IP-DEL-HOST>:8081
#
# PostgreSQL y los backends quedan en la red interna de Docker. Si existe un
# archivo .env en la raíz, Compose toma sus valores; si no, usa los defaults
# de demo (suficientes para una presentación, no para producción).

name: dungeon-crawler-demo

services:
  database:
    image: postgres:16-alpine
    container_name: roguelike_demo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roguelike_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roguelike_pass}
      POSTGRES_DB: ${POSTGRES_DB:-roguelike_db}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-roguelike_user} -d ${POSTGRES_DB:-roguelike_db}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend-express:
    build: ./backend-express
    container_name: roguelike_demo_express
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-roguelike_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-roguelike_pass}
      DB_NAME: ${POSTGRES_DB:-roguelike_db}
      JWT_SECRET: ${JWT_SECRET:-demo-insecure-secret-change-me}
    depends_on:
      database:
        condition: service_healthy

  backend-fastapi:
    build: ./backend-fastapi
    container_name: roguelike_demo_fastapi
    restart: unless-stopped
    environment:
      PORT: 8000
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-roguelike_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-roguelike_pass}
      DB_NAME: ${POSTGRES_DB:-roguelike_db}
      JWT_SECRET: ${JWT_SECRET:-demo-insecure-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      database:
        condition: service_healthy

  frontend-react:
    build:
      context: .
      dockerfile: frontend-react/Dockerfile
    container_name: roguelike_demo_react
    restart: unless-stopped
    ports:
      - "${DEMO_REACT_PORT:-8080}:80"
    depends_on:
      - backend-express
      - backend-fastapi

  frontend-vue:
    build:
      context: .
      dockerfile: frontend-vue/Dockerfile
    container_name: roguelike_demo_vue
    restart: unless-stopped
    ports:
      - "${DEMO_VUE_PORT:-8081}:80"
    depends_on:
      - backend-express
      - backend-fastapi

volumes:
  postgres_demo_data:
