services:
  database:
    image: postgres:16-alpine
    container_name: roguelike_postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend-express:
    build: ./backend-express
    container_name: roguelike_backend_express
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./backend-express:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy

  backend-fastapi:
    build: ./backend-fastapi
    container_name: roguelike_backend_fastapi
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./backend-fastapi:/app
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data: